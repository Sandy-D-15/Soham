<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Submitted | {{ society.name if society and society.name else "Housing Society" }}</title>
    <style>
        :root {
            --bg-dark: #070b16;
            --surface-glass: rgba(17, 24, 39, 0.85);
            --border-glass: rgba(255, 255, 255, 0.12);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.15), transparent 45%),
                linear-gradient(135deg, #040711, #0b1120, #0f172a);
            color: var(--text-main);
            padding: 16px;
        }

        .submitted-card {
            max-width: 460px;
            width: 100%;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 22px;
            padding: 42px 32px;
            text-align: center;
            backdrop-filter: blur(28px);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
        }

        .success-icon-wrap {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: var(--success);
        }

        h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: #ffffff; }
        p { font-size: 14.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px; }

        .btn-home {
            display: inline-block;
            background: var(--primary);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .btn-home:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="submitted-card">
        <div class="success-icon-wrap">✓</div>
        <h1>Registration Submitted</h1>
        <p>Thank you. Your request has been sent to the society admin. You will be able to sign in once it is approved.</p>
        <a href="{{ url_for('auth.login') }}" class="btn-home">Back to Sign In</a>
    </div>
</body>
</html>
