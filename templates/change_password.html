<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | {{ society.name if society and society.name else "Housing Society" }}</title>
    <style>
        :root {
            --bg-dark: #070b16;
            --surface-glass: rgba(17, 24, 39, 0.85);
            --border-glass: rgba(255, 255, 255, 0.12);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --input-bg: rgba(15, 23, 42, 0.7);
            --input-border: rgba(255, 255, 255, 0.14);
            --danger: #ef4444;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-dark) 70%);
            color: var(--text-main);
            padding: 16px;
        }
        .card {
            max-width: 440px;
            width: 100%;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 36px 30px;
            backdrop-filter: blur(24px);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
        }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        p.sub { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
        }
        .form-input:focus { border-color: #818cf8; }
        .alert-box { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
        .alert-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        .alert-info { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-submit:hover { background: var(--primary-hover); }
        .back-link { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: #a5b4fc; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Update Password</h1>
        <p class="sub">Choose a strong password with at least 8 characters, 1 letter, and 1 number.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert-box alert-{{ 'danger' if category in ['error', 'danger'] else category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-input" required autocomplete="current-password">
            </div>

            <div class="form-group">
                <label class="form-label">New Password (Min 8 characters)</label>
                <input type="password" name="new_password" class="form-input" required minlength="8" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-input" required minlength="8" autocomplete="new-password">
            </div>

            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <a href="{{ url_for('dashboard') }}" class="back-link">Return to Dashboard</a>
    </div>
</body>
</html>
